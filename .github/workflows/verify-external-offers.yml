name: Verify optional external offers display
on:
  pull_request:
    paths:
      - 'src/components/ExternalOffers.jsx'
      - 'src/App.jsx'
      - '.github/workflows/verify-external-offers.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
