name: Verify optional external offers display
on:
  pull_request:
    paths:
      - 'src/components/ExternalOffers.jsx'
      - 'src/App.jsx'
      - 'src/utils/externalOfferImages.js'
      - 'scripts/generate-seo-pages.mjs'
      - 'test/external-offer-seo.test.mjs'
      - '.github/workflows/verify-external-offers.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify noindex, indexable pages and illustration assets
        run: node --test test/external-offer-seo.test.mjs
